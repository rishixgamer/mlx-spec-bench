name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable schemas, reports, and isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: |
          mlx-bench validate config examples/reference-sweep.yaml
          mlx-bench validate records tests/fixtures/golden.jsonl
          mlx-bench report tests/fixtures/golden.jsonl

  metal-smoke:
    name: Apple Silicon Metal smoke
    runs-on: macos-15
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test the release distributions on Metal
        run: bash scripts/prepare-release.sh --smoke-only "$RUNNER_TEMP/candidate"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-distributions-${{ github.sha }}
          path: ${{ runner.temp }}/candidate/dist/

  pinned-weights:
    name: Pinned Qwen2.5 weight formats
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[metal]"
      - name: Qualify FP16, Q8, Q6, and Q4 on Metal
        run: |
          test "$(uname -m)" = arm64
          sysctl -n hw.memsize
          run_dir="$(mlx-bench run examples/pinned-weights.yaml --output-dir "$RUNNER_TEMP/pinned-weights")"
          echo "$run_dir"
          python tests/check_pinned_weights.py "$run_dir"
          mlx-bench report "$run_dir" --output "$run_dir/report.md"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-weights-${{ github.sha }}
          path: ${{ runner.temp }}/pinned-weights/
